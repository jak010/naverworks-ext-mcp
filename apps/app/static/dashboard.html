<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>NAVER WORKS Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-emerald-500 rounded-lg flex items-center justify-center text-white font-bold text-lg">
          N
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-900 leading-tight">NAVER WORKS Project Hub</h1>
          <p class="text-xs text-slate-500">FastAPI Custom Server</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="refreshCookies()" class="text-xs px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md font-medium transition flex items-center gap-1.5">
          <i class="fa-solid fa-key text-slate-500"></i> 쿠키 갱신
        </button>
        <a href="/docs" target="_blank" class="text-xs px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-md font-medium transition flex items-center gap-1.5">
          <i class="fa-solid fa-book-open"></i> Swagger API 문서
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Spaces Column -->
      <section class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex flex-col h-[82vh]">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
          <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-folder-tree text-emerald-600"></i> 스페이스 목록
          </h2>
          <button onclick="loadSpaces()" class="text-xs text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>
        </div>
        <div id="spaceList" class="overflow-y-auto space-y-2 flex-1 pr-1 text-sm">
          <div class="text-xs text-slate-400 py-8 text-center">불러오는 중...</div>
        </div>
      </section>

      <!-- Projects Column -->
      <section class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex flex-col h-[82vh]">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
          <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-layer-group text-blue-600"></i> 소속 프로젝트
          </h2>
          <span id="selectedSpaceLabel" class="text-xs text-slate-400 font-normal">스페이스를 선택하세요</span>
        </div>
        <div id="projectList" class="overflow-y-auto space-y-2 flex-1 pr-1 text-sm">
          <div class="text-xs text-slate-400 py-8 text-center">스페이스를 클릭하면 프로젝트가 표시됩니다.</div>
        </div>
      </section>

      <!-- Tasks Column -->
      <section class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex flex-col h-[82vh]">
        <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
          <h2 class="text-sm font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-indigo-600"></i> 태스크 목록
          </h2>
          <span id="selectedProjectLabel" class="text-xs text-slate-400 font-normal">프로젝트를 선택하세요</span>
        </div>
        <div id="taskList" class="overflow-y-auto space-y-2 flex-1 pr-1 text-sm">
          <div class="text-xs text-slate-400 py-8 text-center">프로젝트를 클릭하면 태스크가 표시됩니다.</div>
        </div>
      </section>
    </div>
  </main>

  <script>
    let currentSpaceId = null;

    async function loadSpaces() {
      const container = document.getElementById('spaceList');
      container.innerHTML = '<div class="text-xs text-slate-400 py-8 text-center">스페이스 조회 중...</div>';
      try {
        const res = await fetch('/api/v1/spaces');
        const data = await res.json();
        const spaces = Array.isArray(data) ? data : (data.spaces || []);
        if (spaces.length === 0) {
          container.innerHTML = '<div class="text-xs text-slate-400 py-8 text-center">스페이스가 없습니다.</div>';
          return;
        }
        container.innerHTML = spaces.map(s => `
          <div onclick="selectSpace('${s.spaceId}', '${s.spaceName}')" id="space-card-${s.spaceId}" class="p-3 rounded-lg border border-slate-100 hover:border-slate-300 hover:bg-slate-50 cursor-pointer transition flex items-center justify-between group">
            <div class="flex items-center space-x-2.5 overflow-hidden">
              <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${s.spaceColor || '#4694e5'}"></span>
              <span class="font-medium text-slate-800 text-xs truncate">${s.spaceName}</span>
            </div>
            <i class="fa-solid fa-chevron-right text-xs text-slate-300 group-hover:text-slate-500"></i>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<div class="text-xs text-red-500 py-8 text-center">조회 실패. 세션을 확인하세요.</div>';
      }
    }

    async function selectSpace(spaceId, spaceName) {
      currentSpaceId = spaceId;
      document.querySelectorAll('#spaceList > div').forEach(el => el.classList.remove('bg-emerald-50', 'border-emerald-300'));
      const activeCard = document.getElementById(`space-card-${spaceId}`);
      if (activeCard) activeCard.classList.add('bg-emerald-50', 'border-emerald-300');

      document.getElementById('selectedSpaceLabel').innerText = spaceName;
      const projContainer = document.getElementById('projectList');
      projContainer.innerHTML = '<div class="text-xs text-slate-400 py-8 text-center">프로젝트 조회 중...</div>';
      document.getElementById('taskList').innerHTML = '<div class="text-xs text-slate-400 py-8 text-center">프로젝트를 선택하세요.</div>';

      try {
        const res = await fetch(`/api/v1/spaces/${spaceId}`);
        const data = await res.json();
        const projects = data.projects || (data.spaceFolder && data.spaceFolder.children) || [];
        if (!projects || projects.length === 0) {
          projContainer.innerHTML = '<div class="text-xs text-slate-400 py-8 text-center">소속 프로젝트가 없습니다.</div>';
          return;
        }
        projContainer.innerHTML = projects.map(p => {
          const pid = p.projectId || p.id;
          const pname = p.projectName || p.name || pid;
          return `
            <div onclick="selectProject('${pid}', '${pname}')" class="p-3 rounded-lg border border-slate-100 hover:border-blue-300 hover:bg-blue-50 cursor-pointer transition flex items-center justify-between">
              <span class="font-medium text-slate-800 text-xs truncate">${pname}</span>
              <i class="fa-solid fa-arrow-right text-xs text-slate-300"></i>
            </div>
          `;
        }).join('');
      } catch (err) {
        projContainer.innerHTML = '<div class="text-xs text-red-500 py-8 text-center">프로젝트 조회 실패</div>';
      }
    }

    async function selectProject(projectId, projectName) {
      document.getElementById('selectedProjectLabel').innerText = projectName;
      const taskContainer = document.getElementById('taskList');
      taskContainer.innerHTML = '<div class="text-xs text-slate-400 py-8 text-center">태스크 목록 조회 중...</div>';

      try {
        const res = await fetch(`/api/v1/tasks?project_id=${projectId}`);
        const data = await res.json();
        const tasks = Array.isArray(data) ? data : (data.tasks || []);
        if (tasks.length === 0) {
          taskContainer.innerHTML = '<div class="text-xs text-slate-400 py-8 text-center">등록된 태스크가 없습니다.</div>';
          return;
        }
        taskContainer.innerHTML = tasks.map(t => `
          <div class="p-3 rounded-lg border border-slate-100 bg-white shadow-xs">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded ${t.taskStatusType === 'CLOSED' ? 'bg-slate-100 text-slate-600' : 'bg-emerald-50 text-emerald-700'}">
                ${t.taskStatusType || 'OPEN'}
              </span>
              <span class="text-[10px] text-slate-400">${t.taskId || ''}</span>
            </div>
            <p class="font-medium text-xs text-slate-900 leading-snug">${t.title || '제목 없음'}</p>
          </div>
        `).join('');
      } catch (err) {
        taskContainer.innerHTML = '<div class="text-xs text-red-500 py-8 text-center">태스크 조회 실패</div>';
      }
    }

    async function refreshCookies() {
      if (!confirm('Chrome 키체인에서 네이버웍스 쿠키를 갱신하시겠습니까?')) return;
      try {
        const res = await fetch('/auth/refresh-cookie', { method: 'POST' });
        const data = await res.json();
        alert(data.message || '쿠키가 갱신되었습니다.');
        loadSpaces();
      } catch (err) {
        alert('쿠키 갱신에 실패했습니다.');
      }
    }

    // 초기 로드
    window.addEventListener('DOMContentLoaded', loadSpaces);
  </script>
</body>
</html>
